name: Build Infinity-X 4.0 Port for Vayu

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port:
    name: Port Project Infinity-X 4.0 (Android 17) for POCO X3 Pro
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aria2 python3 zip unzip curl gh

      - name: Download Vayu Android 17 Hardware Base (1.58 GB)
        run: |
          echo "[+] Downloading Vayu Lineage-24.0 Hardware Base..."
          aria2c -s16 -x16 -k1M \
            "https://github.com/xetob/Releases/releases/download/lineage-24.0-20260826-UNOFFICIAL-vayu/lineage-24.0-20260826-UNOFFICIAL-vayu.zip" \
            -o base.zip
          ls -lh base.zip

      - name: Download Project Infinity-X 4.0 Android 17 System Port (2.04 GB)
        run: |
          echo "[+] Downloading Project Infinity-X 4.0 Android 17 Core..."
          aria2c -s16 -x16 -k1M \
            "https://downloads.sourceforge.net/project/infinity-x/surya/17/vanilla/Project_Infinity-X-4.0-surya-07.10.2026-VANILLA-OFFICIAL.zip" \
            -o port.zip
          ls -lh port.zip

      - name: Execute Binary Porting Script
        run: |
          python3 port.py base.zip port.zip Project_Infinity-X-4.0-vayu-VANILLA-UNOFFICIAL.zip
          ls -lh Project_Infinity-X-4.0-vayu-VANILLA-UNOFFICIAL.zip
          sha256sum Project_Infinity-X-4.0-vayu-VANILLA-UNOFFICIAL.zip > sha256.txt
          cat sha256.txt

          # Split into parts under 1.5GB to comply with GitHub 2GB release limit
          split -b 1500M -d Project_Infinity-X-4.0-vayu-VANILLA-UNOFFICIAL.zip Project_Infinity-X-4.0-vayu-VANILLA-UNOFFICIAL.zip.part
          ls -lh Project_Infinity-X-4.0-vayu-VANILLA-UNOFFICIAL.zip.part*

          # Create 1-click Windows merge helper script
          cat << 'EOF' > merge_rom.bat
          @echo off
          echo =======================================================
          echo   Merging Project Infinity-X 4.0 ROM for POCO X3 Pro...
          echo =======================================================
          copy /b Project_Infinity-X-4.0-vayu-VANILLA-UNOFFICIAL.zip.part00 + Project_Infinity-X-4.0-vayu-VANILLA-UNOFFICIAL.zip.part01 Project_Infinity-X-4.0-vayu-VANILLA-UNOFFICIAL.zip
          echo.
          echo [SUCCESS] Complete flashable zip generated!
          echo Flash Project_Infinity-X-4.0-vayu-VANILLA-UNOFFICIAL.zip in OrangeFox recovery.
          pause
          EOF

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ## Project Infinity-X 4.0 (Android 17) for POCO X3 Pro (vayu / bhima)
          
          ![Maintainer](https://raw.githubusercontent.com/PouyaFakhari/infinityx_vayu_builder/main/assets/pouya_maintainer.png)
          
          - **Device:** POCO X3 Pro (`vayu` / `bhima`)
          - **Android Version:** 17 (Baklava / API 37)
          - **ROM Version:** Project Infinity-X 4.0
          - **Build Type:** UNOFFICIAL / RELEASE
          - **Maintainer:** Pouya Fakhari (PouyaPF)
          - **Telegram:** [@Pouya_Fakhari](https://t.me/Pouya_Fakhari)
          
          ### 📥 How to Combine Parts (Windows):
          1. Download `part00`, `part01`, and `merge_rom.bat` into the same folder.
          2. Double-click `merge_rom.bat` (takes 2 seconds to join).
          3. Flash `Project_Infinity-X-4.0-vayu-VANILLA-UNOFFICIAL.zip` in OrangeFox Recovery!
          
          ### Features
          - Full Android 17 core system & framework
          - Dynamic Island, new lockscreen customization & blur surfaces
          - Clean Vanilla build (flash BiTGApps if needed)
          - Built on Qualcomm Snapdragon 860 Vayu hardware drivers
          EOF

          # Delete existing release tag if it was created
          gh release delete "v4.0-pouyapf-vayu" -y || true

          # Create release using gh CLI with split parts
          gh release create "v4.0-pouyapf-vayu" \
            Project_Infinity-X-4.0-vayu-VANILLA-UNOFFICIAL.zip.part00 \
            Project_Infinity-X-4.0-vayu-VANILLA-UNOFFICIAL.zip.part01 \
            merge_rom.bat \
            sha256.txt \
            --title "Project Infinity-X 4.0 Android 17 (POCO X3 Pro - vayu) by Pouya Fakhari" \
            --notes-file release_notes.md
